# Front for Odoo in multi-process (workers) mode: the web client's websocket
# must reach Odoo's evented port 8072, everything else the HTTP port 8069.
# This is Odoo's standard reverse-proxy layout, reduced to what a local
# simulation needs.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream odoo_http { server odoo:8069; }
upstream odoo_ws   { server odoo:8072; }

server {
    listen 8069;
    client_max_body_size 64m;
    proxy_read_timeout 900s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 900s;

    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    location /websocket {
        proxy_pass http://odoo_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://odoo_http;
        proxy_redirect off;
    }
}
